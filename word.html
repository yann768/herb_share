<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#43291b"><title>「字」在必得 · 换字互助</title><style>
:root{--bg:#f5efe2;--paper:#fffaf0;--ink:#39291e;--muted:#827264;--red:#a73d31;--gold:#bd8a32;--line:#dfd0b9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 100% 0,#ead9b8,transparent 34%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.app{width:min(780px,100%);margin:auto;padding:22px 14px 70px}a{color:#38654d;text-decoration:none;font-weight:700}.hero{margin:18px 0;padding:25px;border-radius:22px;background:linear-gradient(135deg,#43291b,#8d4332);color:white;box-shadow:0 12px 35px rgba(87,48,31,.18)}.hero small,.hero p{color:#ebdac8}.hero h1{margin:5px 0;font:700 31px Georgia,"Songti SC",serif}.phrase{display:flex;gap:5px;flex-wrap:wrap;margin-top:16px}.phrase i{display:grid;place-items:center;width:32px;height:38px;border-radius:8px;background:#fff4d8;color:#7f3029;font-style:normal;font-weight:900}.deadline{margin-top:13px;font-size:12px}.toolbar{display:flex;gap:9px;margin:14px 0}.search{flex:1;height:44px;border:1px solid var(--line);border-radius:13px;background:white;padding:0 13px;font-size:15px}.publish{border:0;border-radius:13px;background:var(--red);color:white;padding:0 18px;font-weight:800}.identity,.stats{margin:10px 2px;color:var(--muted);font-size:12px}.identity button{float:right;border:1px solid var(--line);border-radius:10px;background:white;color:var(--muted)}.list{display:grid;gap:11px}.post{padding:16px;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:16px;background:rgba(255,250,240,.94)}.head{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px}.actions span{margin-left:10px;cursor:pointer}.trade{display:grid;grid-template-columns:1fr 42px 1fr;align-items:center;margin:14px 0}.side small{display:block;color:var(--muted)}.chars{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.char{display:grid;place-items:center;min-width:40px;height:40px;padding:0 10px;border-radius:10px;background:#f2e3c7;color:#7a3528;font-size:20px;font-weight:900}.arrow{text-align:center;color:var(--gold);font-size:25px}.remark{color:var(--muted);font-size:13px}.empty{text-align:center;padding:45px;color:var(--muted)}.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(30,20,14,.58)}.modal.open{display:flex}.box{width:min(540px,100%);max-height:90vh;overflow:auto;border-radius:20px;background:var(--paper);padding:20px}.box h2{margin:0 0 15px}.field{display:grid;gap:6px;margin:13px 0;color:var(--muted);font-size:12px}.field input,.field select{height:44px;border:1px solid var(--line);border-radius:11px;background:white;padding:0 11px;font-size:15px}.word-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.word-option{display:grid;place-items:center;height:40px;border:1px solid var(--line);border-radius:9px;background:white;font-size:19px;font-weight:800;cursor:pointer}.word-option.selected{border-color:var(--red);background:#f4d8ce;color:var(--red)}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:17px}.modal-actions button{border:0;border-radius:11px;padding:11px 20px}.cancel{background:#e8dfd2}.submit{background:var(--red);color:white}.toast{position:fixed;left:50%;bottom:35px;z-index:40;transform:translateX(-50%);display:none;padding:10px 16px;border-radius:12px;background:#30251e;color:white}.toast.show{display:block}@media(max-width:520px){.word-grid{grid-template-columns:repeat(4,1fr)}.hero{padding:20px}.trade{grid-template-columns:1fr 32px 1fr}}
</style></head><body><main class="app"><a href="index.html">‹ 返回互助首页</a><section class="hero"><small>五周年限时互助</small><h1>「字」在必得 · 换字广场</h1><p>集齐下方 16 个字可领取双人扫帚。一个字换一个字，可同时填写多个可换出的字。</p><div class="phrase" id="phrase"></div><div class="deadline" id="deadline"></div></section><div class="toolbar"><input class="search" id="search" placeholder="搜索想要的字、可换的字或游戏ID"><button class="publish" id="publishBtn">＋ 发布</button></div><div class="identity">当前游戏ID：<b id="currentId">未设置</b><button id="changeId">修改</button></div><div class="stats">共 <span id="count">0</span> 条有效信息</div><div class="list" id="list"><div class="empty">正在加载…</div></div></main>
<div class="modal" id="modal"><div class="box"><h2 id="modalTitle">发布换字信息</h2><label class="field">游戏ID<input id="gameId" placeholder="方便其他玩家添加你"></label><label class="field">我想要<select id="want"></select></label><div class="field">我可以换出（可多选）<div class="word-grid" id="offers"></div></div><label class="field">备注<input id="remark" placeholder="选填，例如在线时间"></label><div class="modal-actions"><button class="cancel" id="cancel">取消</button><button class="submit" id="submit">发布</button></div></div></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="site-common.js?v=20260813-2"></script><script>
const WORDS=[...'哈利波特魔法觉醒五周年送双人扫帚'],TYPE='anniversary_word',END=Date.parse('2026-09-14T16:00:00Z'),URL='https://ygslzwiznvcfujonvblq.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlnc2x6d2l6bnZjZnVqb252YmxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNDM4NjksImV4cCI6MjA5NTYxOTg2OX0.J9P1NyK5tiSzPZgDeLpwfS2eRaFrP5Gb4fgpmA258vA',sb=supabase.createClient(URL,KEY),GAME='hogwarts_game_id';let owner='',posts=[],selected=[],editing=null,timer
const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),active=()=>Date.now()<END
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),2200)}
function updateDeadline(){const d=END-Date.now();if(d<=0){$('deadline').textContent='活动已结束，发布入口已关闭';$('publishBtn').hidden=true;return}$('deadline').textContent=`距离入口关闭还有 ${Math.ceil(d/86400000)} 天 · 2026年9月15日 00:00 关闭`}
function parseOffers(v){try{const x=JSON.parse(v);return Array.isArray(x)?x.map(o=>o.card||o):[]}catch(e){return[]}}
async function load(){const{data,error}=await sb.from('trade_posts').select('*').eq('want_rarity',TYPE).is('completed_at',null).order('created_at',{ascending:false}).limit(200);if(error)return toast('加载失败：'+error.message);posts=(data||[]).map(p=>({...p,offers:parseOffers(p.offer_cards),isOwn:(p.user_id||p.owner_id)===owner}));render()}
function render(){const kw=$('search').value.trim().toLowerCase(),list=posts.filter(p=>!HW.isBlocked('trade',p.id)&&(!kw||[p.game_id,p.want_card,p.remark,...p.offers].some(x=>String(x||'').toLowerCase().includes(kw))));$('count').textContent=list.length;$('list').innerHTML=list.length?list.map(p=>`<article class="post"><div class="head"><b>🪄 ${esc(p.game_id)}</b><div class="actions">${p.isOwn?`<span onclick="edit('${p.id}')">编辑</span><span onclick="completePost('${p.id}')">完成</span><span onclick="removePost('${p.id}')">删除</span>`:`<span onclick="copyId('${esc(p.game_id)}')">复制ID</span><span onclick="reportPost('${p.id}')">举报</span>`}</div></div><div class="trade"><div class="side"><small>想要</small><div class="chars"><i class="char">${esc(p.want_card)}</i></div></div><div class="arrow">⇌</div><div class="side"><small>可换</small><div class="chars">${p.offers.map(x=>`<i class="char">${esc(x)}</i>`).join('')}</div></div></div>${p.remark?`<div class="remark">💬 ${esc(p.remark)}</div>`:''}</article>`).join(''):'<div class="empty">暂无换字信息，成为第一个发布的人吧</div>'}
function buildForm(){ $('want').innerHTML=WORDS.map(w=>`<option>${w}</option>`).join('');$('offers').innerHTML=WORDS.map(w=>`<span class="word-option ${selected.includes(w)?'selected':''}" data-word="${w}">${w}</span>`).join('')}
function open(post){if(!active())return toast('活动已结束，不能继续发布');editing=post?.id||null;selected=post?.offers?[...post.offers]:[];buildForm();$('gameId').value=post?.game_id||localStorage.getItem(GAME)||'';$('want').value=post?.want_card||WORDS[0];$('remark').value=post?.remark||'';$('modalTitle').textContent=editing?'编辑换字信息':'发布换字信息';$('modal').classList.add('open')}
window.edit=id=>open(posts.find(p=>String(p.id)===String(id)));window.copyId=id=>navigator.clipboard?.writeText(id).then(()=>toast('已复制游戏ID'));window.completePost=async id=>{await sb.from('trade_posts').update({completed_at:Date.now()}).eq('id',id).eq('user_id',owner);load()};window.removePost=async id=>{if(!confirm('确认删除？'))return;await sb.from('trade_posts').delete().eq('id',id).eq('user_id',owner);load()};window.reportPost=async id=>{if(await HW.report(sb,'trade',id)){posts=posts.filter(p=>String(p.id)!==String(id));render()}}
async function submit(){if(!active())return toast('活动已结束');const game=$('gameId').value.trim(),want=$('want').value,remark=$('remark').value.trim();if(!game)return toast('请填写游戏ID');if(!selected.length)return toast('请至少选择一个可换出的字');if(selected.includes(want))return toast('想要的字和可换出的字不能相同');const row={game_id:game,want_card:want,want_rarity:TYPE,offer_cards:JSON.stringify(selected.map(card=>({card,count:1}))),remark,owner_id:owner,user_id:owner,created_at:Date.now()};const q=editing?sb.from('trade_posts').update(row).eq('id',editing).eq('user_id',owner):sb.from('trade_posts').insert(row),{error}=await q;if(error)return toast('发布失败：'+error.message);localStorage.setItem(GAME,game);$('currentId').textContent=game;$('modal').classList.remove('open');toast(editing?'修改成功':'发布成功');load()}
async function init(){owner=(await HW.ensureAuth(sb)).id;$('phrase').innerHTML=WORDS.map(w=>`<i>${w}</i>`).join('');$('currentId').textContent=localStorage.getItem(GAME)||'未设置';buildForm();updateDeadline();setInterval(updateDeadline,60000);$('publishBtn').onclick=()=>open();$('cancel').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};$('offers').onclick=e=>{const el=e.target.closest('[data-word]');if(!el)return;const w=el.dataset.word;selected=selected.includes(w)?selected.filter(x=>x!==w):[...selected,w];buildForm()};$('submit').onclick=submit;$('search').oninput=render;$('changeId').onclick=()=>{const x=prompt('输入游戏ID',localStorage.getItem(GAME)||'');if(x?.trim()){localStorage.setItem(GAME,x.trim());$('currentId').textContent=x.trim()}};await load();sb.channel('word_trade_changes').on('postgres_changes',{event:'*',schema:'public',table:'trade_posts',filter:`want_rarity=eq.${TYPE}`},load).subscribe()}
init()
</script></body></html>
