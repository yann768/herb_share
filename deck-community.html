<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>玩家卡组推荐</title><link rel="stylesheet" href="creation.css?v=20260819-1"></head><body><main class="app"><header><a href="index.html">‹ 返回首页</a><div class="eyebrow">DECK COMMUNITY</div><h1>玩家卡组推荐</h1><p>玩家投稿 · 审核后公开 · 精选后可导入小程序</p><button id="publishBtn">＋ 投稿卡组</button></header><nav id="filters" class="filters"><button data-mode="all" class="active">全部</button><button data-mode="单排">单排</button><button data-mode="双排">双排</button><button data-mode="PVE">PVE</button></nav><section class="toolbar"><button id="publicTab" class="active">公开卡组</button><button id="mineTab">我的投稿</button><button id="reviewTab" hidden>审核台</button><button id="exportBtn" hidden>导出小程序JSON</button><span id="count">加载中…</span></section><section id="grid" class="grid"></section></main><div id="modal" class="mask"><form id="form" class="modal"><div class="modal-head"><h2>投稿卡组</h2><button type="button" id="closeBtn">×</button></div><label>卡组名称<input id="title" maxlength="50" required></label><label>模式<select id="mode"><option>单排</option><option>双排</option><option>PVE</option></select></label><label>回响<input id="echo" maxlength="30" required></label><label>8张基础卡（每行一张）<textarea id="cards" required></textarea></label><label>3张伙伴卡（每行一张）<textarea id="partners" required></textarea></label><label>玩法说明<textarea id="description" maxlength="1500"></textarea></label><label>游戏版本<input id="version" maxlength="30"></label><button type="submit">提交审核</button></form></div><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="deck-community.js?v=20260819-1"></script></body></html>
