<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>换卡互助广场 · 霍格沃茨</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #14100a;
  --bg2: #1f1a10;
  --bg3: #2a2418;
  --border: #3a3020;
  --border2: #5a4a30;
  --gold: #d4a020;
  --gold-dim: #8a6a14;
  --gold-glow: #f0c060;
  --text: #e8d8b0;
  --text-dim: #a89070;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Noto Serif SC', serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 100px; }

header { position: relative; text-align: center; padding: 56px 16px 32px; background: linear-gradient(180deg, rgba(180,140,30,.08) 0%, transparent 100%); border-bottom: 1px solid var(--border); }
header::after { content: ''; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); width: 80px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.header-icon { display: block; font-size: 36px; margin-bottom: 8px; filter: drop-shadow(0 0 12px var(--gold-glow)); }
h1 { font-size: 26px; font-weight: 700; color: var(--gold-glow); letter-spacing: 6px; text-shadow: 0 0 16px rgba(212,160,32,.4); }
.header-sub { font-size: 13px; color: var(--text-dim); letter-spacing: 2px; margin-top: 6px; }

/* 切换按钮组 */
.switch-group {
  position: absolute;
  top: 16px; right: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 10;
}
.page-switch {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-radius: 24px;
  color: #fff;
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 1px;
  text-decoration: none;
  cursor: pointer;
  transition: transform .2s ease, box-shadow .2s ease;
}
.page-switch.to-herb  { background: linear-gradient(135deg, #4aaa4e 0%, #2d7a30 100%); box-shadow: 0 4px 16px rgba(74,170,78,.45),  inset 0 0 0 1px rgba(255,255,255,.12); }
.page-switch.to-cook  { background: linear-gradient(135deg, #e88a30 0%, #c46820 100%); box-shadow: 0 4px 16px rgba(220,120,40,.45), inset 0 0 0 1px rgba(255,255,255,.12); }
.page-switch:hover { transform: translateY(-2px) scale(1.03); }
.page-switch.to-herb:hover { box-shadow: 0 6px 24px rgba(74,170,78,.7),  inset 0 0 0 1px rgba(255,255,255,.2); }
.page-switch.to-cook:hover { box-shadow: 0 6px 24px rgba(220,120,40,.7), inset 0 0 0 1px rgba(255,255,255,.2); }
.page-switch:active { transform: translateY(0) scale(.98); }
.page-switch .ps-icon { font-size: 16px; filter: drop-shadow(0 1px 3px rgba(0,0,0,.4)); }
.page-switch .ps-arrow { font-size: 12px; opacity: .85; transition: transform .2s; }
.page-switch:hover .ps-arrow { transform: translateX(2px); }


.wrap { position: relative; z-index: 1; max-width: 780px; margin: 0 auto; }
.main-content { max-width: 780px; margin: 0 auto; padding: 16px; }

/* 搜索 + 发布 */
.top-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
.search-wrap { flex: 1; position: relative; }
.search-input { width: 100%; background: var(--bg2); border: 1px solid var(--border); color: var(--text); border-radius: 24px; padding: 11px 38px 11px 20px; font-size: 14px; font-family: inherit; outline: none; }
.search-input:focus { border-color: var(--border2); }
.search-input::placeholder { color: var(--text-dim); }
.clear-search { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-dim); cursor: pointer; padding: 4px 8px; font-size: 14px; display: none; }
.post-btn { background: linear-gradient(135deg, var(--gold-dim), var(--gold)); color: #fff; border: none; border-radius: 24px; padding: 10px 22px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; box-shadow: 0 4px 16px rgba(180,140,30,.4); white-space: nowrap; }
.post-btn:hover { opacity: .9; }

/* 筛选 */
.filter-scroll { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.filter-tag { background: var(--bg2); border: 1px solid var(--border); color: var(--text-dim); border-radius: 18px; padding: 6px 16px; font-size: 13px; cursor: pointer; font-family: inherit; transition: all .15s; }
.filter-tag:hover { border-color: var(--border2); }
.filter-tag.active { background: rgba(212,160,32,.15); border-color: var(--gold); color: var(--gold-glow); }

/* 身份栏 */
.identity-bar { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 16px; font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.identity-bar .id-val { color: var(--gold-glow); font-weight: 600; }
.identity-bar .change-id { margin-left: auto; cursor: pointer; padding: 2px 10px; border: 1px solid var(--border); border-radius: 12px; color: var(--text-dim); }
.identity-bar .change-id:hover { color: var(--gold-glow); border-color: var(--gold); }

.stats-bar { font-size: 12px; color: var(--text-dim); padding: 0 4px 10px; }

/* 帖子卡片 */
.post-list { display: flex; flex-direction: column; gap: 12px; }
.post-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 18px; position: relative; animation: fadeIn .25s ease; }
.post-card:hover { border-color: var(--border2); }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
.post-card.rarity-legend { border-left: 3px solid #d4a020; }
.post-card.rarity-epic   { border-left: 3px solid #a058d0; }
.post-card.rarity-rare   { border-left: 3px solid #4a7ad8; }
.post-card.rarity-common { border-left: 3px solid #888; }

.post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; }
.post-id { font-size: 14px; color: var(--gold-glow); font-weight: 700; display: inline-flex; align-items: center; }
.post-rarity { font-size: 11px; padding: 3px 12px; border-radius: 14px; font-weight: 600; }
.post-rarity.legend { background: rgba(212,160,32,.18); color: #f0c060; }
.post-rarity.epic   { background: rgba(160,90,200,.18); color: #c890e0; }
.post-rarity.rare   { background: rgba(80,130,210,.18); color: #80b0e8; }
.post-rarity.common { background: rgba(150,150,150,.18); color: #c0c0c0; }
.post-header-right { display: flex; align-items: center; gap: 8px; }

.copy-id-btn { display: inline-flex; align-items: center; background: var(--bg3); border: 1px solid var(--border2); border-radius: 12px; padding: 2px 10px; font-size: 11px; color: var(--text-dim); cursor: pointer; margin-left: 8px; transition: all .15s; font-family: inherit; }
.copy-id-btn:hover { border-color: var(--gold); color: var(--gold-glow); background: rgba(212,160,32,.1); }
.copy-id-btn:active { transform: scale(.95); }

.trade-main { display: flex; align-items: stretch; gap: 10px; }
.want-side, .offer-side { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; padding: 12px; min-width: 0; }
.side-label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 6px; letter-spacing: 1px; }
.want-card { font-size: 18px; color: var(--text); font-weight: 700; word-break: break-word; }
.offer-tags { display: flex; flex-direction: column; gap: 6px; }
.offer-tag { background: rgba(212,160,32,.12); border: 1px solid rgba(212,160,32,.25); border-radius: 8px; padding: 5px 10px; font-size: 13px; color: var(--text); word-break: break-word; }
.trade-arrow { font-size: 24px; color: var(--gold-dim); align-self: center; flex-shrink: 0; }

.post-remark { margin-top: 12px; padding: 10px 14px; background: var(--bg3); border-radius: 8px; font-size: 12px; color: var(--text-dim); line-height: 1.6; border-left: 2px solid var(--border2); }
.delete-btn { background: rgba(192,57,43,.15); border: 1px solid rgba(192,57,43,.4); border-radius: 14px; padding: 3px 12px; font-size: 11px; color: #e88080; cursor: pointer; }
.delete-btn:hover { background: rgba(192,57,43,.3); }
.edit-btn { background: rgba(74,130,200,.15); border: 1px solid rgba(74,130,200,.4); border-radius: 14px; padding: 3px 12px; font-size: 11px; color: #80b0e8; cursor: pointer; margin-right: 6px; }
.edit-btn:hover { background: rgba(74,130,200,.3); }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
.empty-state .ei { font-size: 48px; display: block; margin-bottom: 12px; }

/* 弹窗 */
.modal-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 100; justify-content: center; align-items: flex-end; }
.modal-mask.open { display: flex; }
.modal-box { background: var(--bg2); width: 100%; max-width: 540px; max-height: 88vh; border-radius: 20px 20px 0 0; overflow: hidden; display: flex; flex-direction: column; animation: slideUp .25s ease; }
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-title { font-size: 18px; font-weight: 700; color: var(--gold-glow); }
.modal-close { font-size: 22px; cursor: pointer; color: var(--text-dim); padding: 0 8px; }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }

.tip-box { background: rgba(212,160,32,.08); border: 1px solid rgba(212,160,32,.25); border-radius: 10px; padding: 10px 14px; font-size: 12px; color: var(--text-dim); line-height: 1.6; margin-bottom: 16px; }

.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 13px; color: var(--gold-glow); margin-bottom: 8px; font-weight: 600; letter-spacing: 1px; }
.form-input { width: 100%; background: var(--bg3); border: 1px solid var(--border2); color: var(--text); border-radius: 10px; padding: 11px 14px; font-size: 14px; font-family: inherit; outline: none; }
.form-input:focus { border-color: var(--gold); }
.form-input::placeholder { color: var(--text-dim); }

/* 品质 picker */
.rarity-picker { display: flex; gap: 8px; flex-wrap: wrap; }
.rarity-opt { padding: 8px 16px; border-radius: 18px; font-size: 13px; cursor: pointer; border: 1px solid var(--border2); background: var(--bg3); color: var(--text-dim); transition: all .15s; }
.rarity-opt.sel-legend { background: rgba(212,160,32,.2); border-color: #d4a020; color: #f0c060; }
.rarity-opt.sel-epic   { background: rgba(160,90,200,.2); border-color: #a058d0; color: #c890e0; }
.rarity-opt.sel-rare   { background: rgba(80,130,210,.2); border-color: #4a7ad8; color: #80b0e8; }
.rarity-opt.sel-common { background: rgba(150,150,150,.2); border-color: #888; color: #d0d0d0; }

/* 多张 offer */
.offer-input-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.card-select { cursor: pointer; }
.card-select option { background: var(--bg2); }
.offer-input-row .card-select { flex: 1; }
.offer-input-row .qty-input { width: 80px; flex-shrink: 0; text-align: center; }
.offer-input-row .remove-row { color: var(--text-dim); cursor: pointer; padding: 0 8px; font-size: 18px; flex-shrink: 0; }
.offer-input-row .remove-row:hover { color: #e88080; }
.add-offer-btn { background: rgba(212,160,32,.1); border: 1px dashed var(--border2); color: var(--gold-glow); border-radius: 10px; padding: 10px; width: 100%; cursor: pointer; font-size: 13px; font-family: inherit; margin-top: 6px; }
.add-offer-btn:hover { background: rgba(212,160,32,.18); border-color: var(--gold); }

.btn-cancel { flex: 1; padding: 12px; text-align: center; border-radius: 10px; background: var(--bg3); border: 1px solid var(--border2); color: var(--text-dim); cursor: pointer; font-family: inherit; font-size: 14px; }
.btn-submit { flex: 2; padding: 12px; text-align: center; border-radius: 10px; background: linear-gradient(135deg, var(--gold-dim), var(--gold)); color: #fff; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 14px; border: none; box-shadow: 0 4px 16px rgba(180,140,30,.4); }

.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: #2a1f10; color: var(--gold-glow); border: 1px solid var(--border2); border-radius: 24px; padding: 10px 24px; font-size: 14px; opacity: 0; transition: opacity .25s, transform .25s; z-index: 9999; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: #3a1010; color: #f08080; border-color: #6a2828; }
.loading-overlay { display: none; position: fixed; inset: 0; background: rgba(20,16,10,.7); z-index: 500; align-items: center; justify-content: center; flex-direction: column; gap: 16px; color: var(--gold-glow); font-size: 15px; }
.loading-overlay.show { display: flex; }
.spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }

@media (max-width: 480px) {
  header { padding: 40px 16px 28px; }
  h1 { font-size: 22px; letter-spacing: 4px; }
  .switch-group { top: 12px; right: 12px; gap: 6px; }
  .page-switch { padding: 6px 12px; font-size: 12px; }
  .page-switch .ps-icon { font-size: 14px; }
  .modal-box { border-radius: 20px 20px 0 0; }
}
</style>
</head>

      <div class="form-group">

      <div class="form-group">
        <label class="form-label">🎴 可换出的卡 *</label>
        <div id="offerList"></div>

      </div>

      <div class="form-group">
        <label class="form-label">💬 备注（可选）</label>
        <input class="form-input" id="fRemark" placeholder="选填">
      </div>
    </div>
    <div class="modal-footer">
      <div class="btn-cancel" onclick="closePublish()">取消</div>
      <div class="btn-submit" onclick="submitPost()">发布</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loading-overlay" id="loading"><div class="spinner"></div><span>处理中…</span></div>

  epic:   ['三头犬宝宝','三本妖怪书','卡珊德拉·沃雷','变形咒','嗅嗅','四分五裂','多重冰冻咒','弗雷兄弟','把戏坊烟花盒','摄神取念','摇摆蝎尾兽','时间转换器','格洛普','欣克庞克','洛蒂·特纳','游走球','漂浮炸弹','火灰蛇','火焰熊熊','特波疣猪','独角兽','狼牙飞碟','甜点大师','皮皮鬼','神锋无影','艾薇·沃林顿','芭蕾巨怪','蜷翼魔','闪回咒','阿比盖尔·格雷','除你武器','隐形兽','雪人飞来','雷鸟','霹雳爆炸','韦斯莱烟花','预言水晶球','飓风咒','飞来咒','飞鸟群群','食死徒','骑士公共汽车','高布石','鲁伯·海格','鸟蛇'],
  rare:   ['丹尼尔·佩杰','云雾缥缈','充气咒','八眼蜘蛛巢穴','冰冻咒','凯文·法雷尔','咒语大全','妖怪们的妖怪书','巨怪','恶婆鸟','愈合如初','打人柳','月痴兽','棋子士兵','气象咒','消失柜','混淆咒','清水如泉','火螃蟹','灵猫','炸尾螺','热流咒','犀角兽','盔甲护身','统统石化','萝宾·西斯尔思韦特','记忆瓶','随从显形','雪怪','雪球咒','飞天扫帚','飞沙走石','飞路网'],
  common: ['万弹齐发','全速击退','八眼巨蛛的毒液','吼叫信','多洛雷斯·乌姆里奇','小蜘蛛群','带翼弹弓','康沃尔郡小精灵','快快复苏','整蛊礼物盒','昏昏倒地','白鲜香精','统统加护','统统归来','肿胀药水','莫特拉鼠','速速禁锢','门钥匙','马人','魔法跳跳糖'],
}

const FILTERS = [
  { id:'all',    label:'全部' },
  { id:'legend', label:'🟡 传说' },
  { id:'epic',   label:'🟣 史诗' },
  { id:'rare',   label:'🔵 稀有' },
  { id:'common', label:'⚪ 普通' },
]
const RARITY_LABELS = { legend:'传说', epic:'史诗', rare:'稀有', common:'普通' }

let allPosts = [], filteredPosts = [], activeFilter = 'all', searchKw = ''
let selectedRarity = 'legend'
let myOwnerId = ''
let myGameId = ''
let pendingOffers = [{ card:'', count:'' }]
let editingPostId = null

async function init() {
  myOwnerId = (await HW.ensureAuth(sb)).id
  myGameId = localStorage.getItem(GAME_ID_KEY) || ''
  document.getElementById('myIdDisplay').textContent = myGameId || '（未设置）'

  buildFilters()
  await loadPosts()
  sb.channel('trade_posts_changes').on('postgres_changes', { event:'*', schema:'public', table:'trade_posts' }, () => loadPosts()).subscribe()
}

function changeId() {
  const n = prompt('输入游戏ID（仅显示用，不影响帖子所有权）:', myGameId)
  if (n !== null && n.trim() !== '') {
    myGameId = n.trim()
    localStorage.setItem(GAME_ID_KEY, myGameId)
    document.getElementById('myIdDisplay').textContent = myGameId
    showToast('游戏ID已更新，所有页面同步生效')
  }
}

function buildFilters() {
  document.getElementById('filterScroll').innerHTML = FILTERS.map(f =>
    `<span class="filter-tag ${f.id==='all'?'active':''}" data-id="${f.id}" onclick="setFilter(this)">${f.label}</span>`
  ).join('')
}

function setFilter(el) {
  document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'))
  el.classList.add('active')
  activeFilter = el.dataset.id
  applyFilter()
}

async function loadPosts() {
  showLoading(true)
  try {
    const { data, error } = await sb
      .from('trade_posts')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(200)
    if (error) throw error
    allPosts = (data || []).map(processPost)
    applyFilter()
  } catch(e) {
    console.error(e)
    showToast('加载失败，请刷新重试', true)
  } finally {
    showLoading(false)
  }
}

function parseOffers(s) {
  try {
    const o = JSON.parse(s)
    if (Array.isArray(o)) return o
  } catch(e) {}
  return [{ card: String(s||''), count: '' }]
}

function processPost(p) {
  const offers = parseOffers(p.offer_cards)
  return {
    id: p.id,
    gameId: p.game_id,
    wantCard: p.want_card,
    wantRarity: p.want_rarity || 'common',
    offers,
    remark: p.remark || '',
    ownerId: p.user_id || p.owner_id,
    createdAt: p.created_at,
    rarityLabel: RARITY_LABELS[p.want_rarity] || '普通',
    isOwn: (p.user_id || p.owner_id) === myOwnerId,
    completedAt: p.completed_at || null,
  }
}

function onSearch() {
  searchKw = document.getElementById('searchInput').value
  document.getElementById('clearBtn').style.display = searchKw ? 'block' : 'none'
  applyFilter()
}

function clearSearch() {
  document.getElementById('searchInput').value = ''
  searchKw = ''
  document.getElementById('clearBtn').style.display = 'none'
  applyFilter()
}

function applyFilter() {
  let list = allPosts.filter(p => !HW.isBlocked('trade',p.id) && !p.completedAt)
  if (searchKw.trim()) {
    const kw = searchKw.trim().toLowerCase()
    list = list.filter(p =>
      (p.wantCard||'').toLowerCase().includes(kw) ||
      (p.gameId||'').toLowerCase().includes(kw) ||
      p.offers.some(o => (o.card||'').toLowerCase().includes(kw))
    )
  }
  if (activeFilter !== 'all') {
    list = list.filter(p => p.wantRarity === activeFilter)
  }
  filteredPosts = list
  document.getElementById('statTotal').textContent = allPosts.length
  document.getElementById('statShown').textContent = list.length
  renderList()
}

function renderList() {
  const el = document.getElementById('postList')
  if (!filteredPosts.length) {
    el.innerHTML = `<div class="empty-state"><span class="ei">🃏</span><p>暂无相关换卡信息</p></div>`
    return
  }
  el.innerHTML = filteredPosts.map((p, i) => `
    <div class="post-card rarity-${p.wantRarity}" style="animation-delay:${i*30}ms">
      <div class="post-header">
        <span class="post-id">🪄 ${esc(p.gameId)}${!p.isOwn?`<span class="copy-id-btn" onclick="copyToClipboard('${esc(p.gameId)}', this)">📋 复制</span>`:''}</span>
        <div class="post-header-right">
          <span class="post-rarity ${p.wantRarity}">${p.rarityLabel}</span>
          ${p.isOwn?`<span class="edit-btn" onclick="openPublish(filteredPosts.find(x=>x.id==='${p.id}'))">编辑</span><span class="edit-btn" onclick="completePost('${p.id}')">完成</span><span class="delete-btn" onclick="deletePost('${p.id}')">删除</span>`:`<span class="delete-btn" onclick="moderatePost('${p.id}')">举报/屏蔽</span>`}
        </div>
      </div>
      <div class="trade-main">
        <div class="want-side">
          <span class="side-label">想要</span>
          <span class="want-card">${esc(p.wantCard)}</span>
        </div>
        <span class="trade-arrow">⇌</span>
        <div class="offer-side">
          <span class="side-label">可换</span>
          <div class="offer-tags">
            ${p.offers.map(o => `<span class="offer-tag">${esc(o.card)}${o.count?` ×${esc(o.count)}`:''}</span>`).join('')}
          </div>
        </div>
      </div>
      ${p.remark?`<div class="post-remark">💬 ${esc(p.remark)}</div>`:''}
    </div>
  `).join('')
}

function openPublish(editPost = null) {
  editingPostId = editPost ? editPost.id : null
  pendingOffers = editPost ? editPost.offers.map(o=>({card:o.card,count:o.count})) : [{ card:'', count:'' }]
  renderOfferInputs()
  document.getElementById('fGameId').value = myGameId || ''
  document.getElementById('fRemark').value = editPost ? (editPost.remark||'') : ''
  if (editPost) {
    const rEl = document.querySelector(`#rarityPicker .rarity-opt[data-r="${editPost.wantRarity}"]`)
    if (rEl) setRarity(rEl)
    // 预选想要的卡
    setTimeout(() => {
      const wSel = document.getElementById('fWantCard')
      if (wSel) wSel.value = editPost.wantCard
    }, 50)
  } else {
    loadLastForm()
    buildCardOptions(document.getElementById('fWantCard'), '')
  }
  document.querySelector('#publishModal .modal-title').textContent = editingPostId ? '✏️ 修改换卡信息' : '🃏 发布换卡信息'
  document.querySelector('#publishModal .btn-submit').textContent = editingPostId ? '保存修改' : '发布'
  document.getElementById('publishModal').classList.add('open')
}

function closePublish() { document.getElementById('publishModal').classList.remove('open') }
function onMaskClick(e, id) { if (e.target === document.getElementById(id)) document.getElementById(id).classList.remove('open') }

function setRarity(el) {
  document.querySelectorAll('#rarityPicker .rarity-opt').forEach(o => o.className = 'rarity-opt')
  el.className = `rarity-opt sel-${el.dataset.r}`
  selectedRarity = el.dataset.r
  // 联动更新所有卡牌下拉
  updateCardSelects()
}

// 构建某个 select 元素的选项（品质内卡牌）
function buildCardOptions(selectEl, currentVal) {
  const cards = CARD_LIST[selectedRarity] || []
  selectEl.innerHTML = `<option value="">— 选择卡牌 —</option>` +
    cards.map(n => `<option value="${esc(n)}"${n===currentVal?' selected':''}>${esc(n)}</option>`).join('')
}

// 更新"想要的卡"及所有"可换出"的下拉
function updateCardSelects() {
  const wantSel = document.getElementById('fWantCard')
  if (wantSel) buildCardOptions(wantSel, wantSel.value)
  // 更新每行 offer 的 select
  document.querySelectorAll('#offerList .card-select').forEach(sel => {
    buildCardOptions(sel, sel.value)
  })
}

function renderOfferInputs() {
  const el = document.getElementById('offerList')
  el.innerHTML = pendingOffers.map((o, i) => `
    <div class="offer-input-row">
      <select class="form-input card-select" onchange="updateOffer(${i},'card',this.value)">
        <option value="">— 选择卡牌 —</option>
      </select>
      <input class="form-input qty-input" placeholder="数量" type="number" min="1" value="${esc(o.count)}" oninput="updateOffer(${i},'count',this.value)">
      ${pendingOffers.length>1?`<span class="remove-row" onclick="removeOffer(${i})">✕</span>`:''}
    </div>
  `).join('')
  // 渲染后填充选项并恢复已选值
  document.querySelectorAll('#offerList .card-select').forEach((sel, i) => {
    buildCardOptions(sel, pendingOffers[i]?.card || '')
  })
}

function updateOffer(i, field, val) {
  if (!pendingOffers[i]) pendingOffers[i] = { card:'', count:'' }
  pendingOffers[i][field] = val
}
function addOffer() {
  if (pendingOffers.length >= 8) return showToast('最多 8 张备选', true)
  pendingOffers.push({ card:'', count:'' })
  renderOfferInputs()
}
function removeOffer(i) {
  pendingOffers.splice(i, 1)
  if (!pendingOffers.length) pendingOffers = [{ card:'', count:'' }]
  renderOfferInputs()
}

function saveLastForm() {
  try {
    localStorage.setItem(LAST_FORM_KEY, JSON.stringify({ rarity: selectedRarity, remark: document.getElementById('fRemark').value }))
  } catch(e) {}
}
function loadLastForm() {
  try {
    const raw = localStorage.getItem(LAST_FORM_KEY); if (!raw) return
    const o = JSON.parse(raw)
    if (o.rarity) {
      const t = document.querySelector(`#rarityPicker .rarity-opt[data-r="${o.rarity}"]`)
      if (t) setRarity(t)
    }
    if (o.remark !== undefined) document.getElementById('fRemark').value = o.remark || ''
  } catch(e) {}
}

async function copyToClipboard(text, btnEl) {
  try {
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text)
    else {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0'
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta)
    }
    showToast('已复制：' + text)
    if (btnEl) { const old = btnEl.textContent; btnEl.textContent = '✓ 已复制'; setTimeout(()=> btnEl.textContent = old, 1500) }
  } catch(e) { showToast('复制失败', true) }
}

async function submitPost() {
  const gameId = document.getElementById('fGameId').value.trim()
  const wantCard = document.getElementById('fWantCard').value
  const remark = document.getElementById('fRemark').value.trim()
  if (!gameId) return showToast('请填写游戏ID', true)
  if (!wantCard) return showToast('请选择想要的卡', true)
  const validOffers = pendingOffers.filter(o => o.card.trim()).map(o => ({ card: o.card.trim(), count: o.count.toString().trim() }))
  if (!validOffers.length) return showToast('请至少选择一张可换出的卡', true)

  myGameId = gameId
  localStorage.setItem(GAME_ID_KEY, myGameId)
  document.getElementById('myIdDisplay').textContent = myGameId

  showLoading(true)
  try {
    if (editingPostId) {
      const { error } = await sb.from('trade_posts').update({
        game_id: gameId,
        want_card: wantCard,
        want_rarity: selectedRarity,
        offer_cards: JSON.stringify(validOffers),
        remark,
      }).eq('id', editingPostId).eq('owner_id', myOwnerId)
      if (error) throw error
      saveLastForm(); closePublish(); showToast('修改成功！🃏')
    } else {
      const { error } = await sb.from('trade_posts').insert({
        game_id: gameId,
        want_card: wantCard,
        want_rarity: selectedRarity,
        offer_cards: JSON.stringify(validOffers),
        remark,
        owner_id: myOwnerId,
        user_id: myOwnerId,
        created_at: Date.now(),
      })
      if (error) throw error
      saveLastForm(); closePublish(); showToast('发布成功！🃏')
    }
    pendingOffers = [{ card:'', count:'' }]
  } catch(e) {
    console.error(e)
    showToast('发布失败：' + (e.message || '请重试'), true)
  } finally {
    showLoading(false)
  }
}

async function deletePost(id) {
  if (!confirm('确认删除这条换卡信息？')) return
  showLoading(true)
  try {
    const { error } = await sb.from('trade_posts').delete().eq('id', id).eq('user_id', myOwnerId)
    if (error) throw error
    showToast('已删除')
  } catch(e) {
    showToast('删除失败：' + (e.message || '请重试'), true)
  } finally {
    showLoading(false)
  }
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
}
function showLoading(on) { document.getElementById('loading').classList.toggle('show', on) }
let toastTimer
function showToast(msg, isErr=false) {
  const el = document.getElementById('toast')
  el.textContent = msg
  el.className = 'toast show' + (isErr?' error':'')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500)
}

async function completePost(id){if(!confirm('标记为已完成并从列表隐藏？'))return;const{error}=await sb.from('trade_posts').update({completed_at:Date.now()}).eq('id',id).eq('user_id',myOwnerId);if(error)return showToast('操作失败：'+error.message,true);showToast('已完成')}
async function moderatePost(id){try{if(await HW.report(sb,'trade',id)){allPosts=allPosts.filter(p=>String(p.id)!==String(id));applyFilter();showToast('已举报并屏蔽')}}catch(err){showToast('举报失败：'+err.message,true)}}
init().then(() => { if(HW.shouldPublish()){openPublish();const p=HW.params(),rarity=p.get('rarity');if(rarity){const el=document.querySelector(`#rarityPicker [data-r="${rarity}"]`);if(el)setRarity(el)}const want=p.get('want');if(want)setTimeout(()=>document.getElementById('fWantCard').value=want,0);const offers=HW.importedItems('offers');if(offers.length){pendingOffers=offers.map(card=>({card,count:'1'}));renderOfferInputs()}HW.sourceNotice(showToast)} })
</script>
