<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b2b"><meta name="description" content="管理已拥有和缺失的收藏品，查看分类进度并备份收藏记录。"><title>我的收藏册 · 霍格沃茨互助站</title><link rel="stylesheet" href="catalog.css?v=20260816-2"><link rel="stylesheet" href="collection.css?v=20260817-1"></head>
<body><main class="app"><header class="top"><div><a class="back" href="catalog.html">‹ 返回资料档案库</a><div class="eyebrow">MY COLLECTION</div><h1>我的收藏册</h1><p class="subtitle">只管理可收藏物品：查看拥有、缺失和完成进度，并备份收藏记录</p></div><a class="collection-link" href="catalog.html">查询全部档案</a></header>
<section class="overview"><div class="ring" id="totalRing"><div><b id="totalRate">0%</b><span>总收藏率</span></div></div><div class="overview-copy"><span>已收藏</span><strong><b id="ownedTotal">0</b> / <span id="itemTotal">0</span></strong><p id="overviewTip">从资料检索中标记你已拥有的内容</p></div></section>
<section class="cbg-import"><div><b>从藏宝阁导入账号收藏</b><p>粘贴正在出售或公示中的角色商品链接，解析后会与本机收藏合并。</p></div><div class="cbg-import-row"><input id="cbgUrl" type="url" inputmode="url" autocomplete="off" placeholder="粘贴 hp.cbg.163.com 商品链接"><button id="cbgImportBtn">开始解析</button></div><p class="cbg-status" id="cbgStatus" aria-live="polite"></p></section>
<section class="collection-tools"><button id="exportBtn">导出备份</button><button id="importBtn">从 JSON 恢复</button><button id="missingBtn">下载缺失清单</button><input id="importFile" type="file" accept="application/json,.json" hidden></section>
<section class="category-stats" id="categoryStats"></section>
<section class="controls"><div class="filters" id="categoryFilters"></div><div class="state-tabs"><button class="state active" data-state="all">全部</button><button class="state" data-state="owned">已拥有</button><button class="state" data-state="missing">未拥有</button><button class="state" data-state="recent">最近新增</button></div><div class="collection-filter-row"><select id="collectionYear"><option value="all">全部年份</option></select><div class="collection-search"><input id="collectionSearch" placeholder="在收藏中搜索…"><span>⌕</span></div></div></section>
<div class="summary"><h2 id="listTitle">全部收藏</h2><span id="listCount">加载中…</span></div><section class="collection-grid" id="collectionGrid"><div class="empty">正在读取收藏记录…</div></section></main>
<script src="collection.js?v=20260817-2"></script></body></html>
