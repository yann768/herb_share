<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b2b"><meta name="description" content="计算限定卡池 UP 数量和常驻卡池出金概率"><title>卡池概率分析 · 霍格沃茨互助站</title><link rel="stylesheet" href="probability.css?v=20260816-1"></head><body><main class="app">
<header><a href="index.html">← 返回互助首页</a><div class="eyebrow">PROBABILITY LAB</div><h1>卡池概率分析</h1><p>不模拟抽卡过程，只回答“抽这些次大概能拿到多少张”和“至少出一次的概率”。</p></header>
<section class="notice">规则取自现有小程序卡池数据。概率结果是数学估算，不代表单个账号的实际结果；游戏调整卡池规则后需同步更新。</section>
<div class="pool-tabs"><button class="active" data-pool="limited">红钥匙 · 单 UP</button><button data-pool="mixed">红钥匙 · 混池</button><button data-pool="gold">金钥匙池</button><button data-pool="silver">银钥匙池</button></div>
<section class="calculator"><div class="controls"><h2 id="poolTitle">红钥匙 · 单 UP 限定池</h2><label>抽卡次数（消耗钥匙数）<input id="draws" type="number" min="1" step="1" inputmode="numeric" value="10"></label><div class="quick"><button data-draws="1">1 次</button><button data-draws="10">10 次</button><button data-draws="20">20 次</button><button data-draws="50">50 次</button><button data-draws="100">100 次</button></div><label>当前保底进度 <span id="pityHint">已连续 0 / 50 张未出金</span><input id="pity" type="range" min="0" max="49" value="0"></label><div id="ruleText" class="rule"></div></div>
<div class="results"><div class="hero-result"><span id="mainLabel">预计获得 UP</span><strong id="expected">0</strong><small id="rangeText"></small></div><div class="mixed-summary" id="mixedSummary" hidden><article><span>🆕 新卡</span><b id="newExpected">0</b><small id="newChance"></small></article><article><span>↩ 返场卡</span><b id="returnExpected">0</b><small id="returnChance"></small></article></div><div class="stat-grid"><article><span id="chanceLabel">至少 1 张 UP</span><b id="atLeastOne">0%</b></article><article><span id="goldLabel">预计出金</span><b id="expectedGold">0</b></article><article><span id="atLeastGoldLabel">至少出金一次</span><b id="atLeastGold">0%</b></article><article><span>消耗钥匙</span><b id="keyCost">0</b></article></div></div></section>
<section class="panel"><div class="panel-head"><h2 id="distTitle">UP 数量概率分布</h2><small>混池默认展示玩家更关心的新卡</small></div><div id="distribution" class="distribution"></div></section>
<section class="panel explanation"><h2>结果怎么理解？</h2><div id="explanation"></div></section>
</main><script src="probability-core.js?v=20260817-1"></script><script src="probability.js?v=20260817-1"></script></body></html>
