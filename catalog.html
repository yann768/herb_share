<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173b2b">
  <meta name="description" content="统一检索收藏资料、上新返场、赛季和平衡调整档案。">
  <title>资料档案库 · 霍格沃茨互助站</title>
  <link rel="stylesheet" href="catalog.css?v=20260816-1">
</head>
<body>
<main class="app">
  <header class="top">
    <div><a class="back" href="index.html">‹ 返回互助首页</a><div class="eyebrow">HOGWARTS ARCHIVE</div><h1>资料档案库</h1><p class="subtitle">查询全部物品、上新返场、赛季和平衡记录，也可标记收藏</p></div>
    <div class="top-actions"><a class="collection-link" href="collection.html">查看我的收藏</a><button class="mini-link" id="miniLink">更多功能在小程序</button></div>
  </header>
  <section class="search-panel">
    <div class="search"><input id="searchInput" placeholder="搜索名称、年份或获取方式…" autocomplete="off"><button class="clear" id="clearBtn" aria-label="清除搜索">×</button></div>
    <div class="select-filters"><label>年份<select id="yearFilter"><option value="all">全部年份</option></select></label><label>获取方式<select id="sourceFilter"><option value="all">全部获取方式</option></select></label></div>
    <div class="filter-nav"><button class="filter-arrow prev" id="filterPrev" type="button" aria-label="向左查看更多分类">‹</button><div class="filter-scroll" id="filterScroll" aria-label="资料分类，可拖动或左右滑动查看更多"><div class="filters" id="filters"></div></div><button class="filter-arrow next" id="filterNext" type="button" aria-label="向右查看更多分类">›</button></div>
  </section>
  <div class="summary"><h2 id="resultTitle">全部资料</h2><span id="resultCount">加载中…</span></div>
  <section class="grid" id="grid"><div class="empty">正在整理魔法档案…</div></section>
</main>
<div class="mask" id="detailMask"><article class="detail"><div class="detail-head"><b id="detailTitle">资料详情</b><button class="close" aria-label="关闭">×</button></div><div class="detail-content" id="detailContent"></div></article></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="site-common.js?v=20260814-1"></script>
<script src="catalog.js?v=20260816-1"></script>
</body>
</html>
