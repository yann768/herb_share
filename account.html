<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>邮箱登录 · 魔法觉醒资料站</title><link rel="stylesheet" href="creation.css?v=20260819-1"></head><body><main class="app"><header><a href="index.html">‹ 返回首页</a><div class="eyebrow">ACCOUNT</div><h1>邮箱验证码登录</h1><p>邮箱只用于登录，不会公开展示。</p></header><section class="modal" style="margin:auto"><label>邮箱<input id="email" type="email" autocomplete="email" placeholder="name@example.com"></label><button id="sendBtn" type="button">发送验证码</button><label>验证码<input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8"></label><button id="verifyBtn" type="button">验证并登录</button><label>公开昵称<input id="nickname" maxlength="20" placeholder="2～20个字符"></label><button id="saveBtn" type="button">保存昵称</button><p id="state" class="notice">浏览无需登录；投稿、举报和云端收藏需要邮箱登录。</p><button id="logoutBtn" type="button" hidden>退出登录</button></section></main><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="account.js?v=20260819-1"></script></body></html>
