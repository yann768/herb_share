<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11251d">
  <meta name="description" content="快速查找草药、菜品和换卡信息，自动匹配你的需求。">
  <meta property="og:title" content="霍格沃茨互助站">
  <meta property="og:description" content="更快找到你需要的草药、菜品和卡牌">
  <meta property="og:type" content="website">
  <meta property="og:image" content="og.png">
  <title>霍格沃茨互助站</title>
  <style>
    :root{--bg:#f4f1e8;--paper:#fffdf7;--ink:#193227;--muted:#6b776f;--green:#275d45;--green2:#3b7a5b;--gold:#c49342;--line:#ded8c9;--red:#a44942;--shadow:0 10px 30px rgba(34,61,47,.09)}
    *{box-sizing:border-box}html{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}body{margin:0;min-height:100vh;background:radial-gradient(circle at 100% 0,#dfe9dc 0,transparent 33%),var(--bg)}button,input{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:0 16px calc(92px + env(safe-area-inset-bottom))}
    header{padding:26px 2px 16px;display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:2px}.brand{margin:4px 0 2px;font-family:Georgia,"Songti SC",serif;font-size:28px}.subtitle{margin:0;color:var(--muted);font-size:13px}.avatar{width:44px;height:44px;border-radius:14px;border:1px solid #cad6cc;background:#e6eee6;color:var(--green);font-size:20px}
    .search{position:relative;margin:4px 0 14px}.search input{width:100%;height:52px;border:1px solid var(--line);border-radius:17px;background:var(--paper);padding:0 48px 0 46px;color:var(--ink);outline:none;box-shadow:var(--shadow)}.search input:focus{border-color:var(--green2)}.search:before{content:'⌕';position:absolute;left:17px;top:9px;font:27px Georgia;color:var(--green)}.clear{position:absolute;right:10px;top:9px;width:34px;height:34px;border:0;background:transparent;color:#929a94;font-size:20px;display:none}
    .hero{background:linear-gradient(135deg,#173b2b,#2e6249);border-radius:22px;padding:19px;color:#fff;box-shadow:0 14px 28px rgba(25,58,43,.18);position:relative;overflow:hidden}.hero:after{content:'✦';position:absolute;right:20px;top:-15px;font-size:96px;color:rgba(255,255,255,.06)}.hero h2{font:21px Georgia,"Songti SC",serif;margin:0 0 7px}.hero p{font-size:13px;color:#dce9df;margin:0 0 16px}.hero-row{display:flex;gap:9px}.hero button{border:0;border-radius:12px;padding:10px 14px;font-weight:700}.primary{background:#f3d294;color:#3d3019}.secondary{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)!important}
    .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 20px}.quick button{border:1px solid var(--line);border-radius:17px;background:var(--paper);padding:14px 4px;color:var(--ink);box-shadow:0 4px 14px rgba(32,54,43,.04)}.quick b{display:block;font-size:23px;margin-bottom:5px}.quick span{font-size:13px;font-weight:700}
    .section{margin-top:20px}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:10px}.section h2{font-size:18px;margin:0}.section-head small{color:var(--muted)}.link-btn{border:0;background:transparent;color:var(--green2);font-weight:700;padding:4px}
    .chips{display:flex;gap:8px;overflow:auto;padding:2px 1px 7px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--paper);padding:8px 13px;border-radius:999px;color:var(--muted)}.chip.active{background:var(--green);border-color:var(--green);color:white}
    .list{display:grid;gap:10px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 5px 18px rgba(33,55,44,.04)}.card-top{display:flex;gap:10px;align-items:flex-start}.type-icon{width:42px;height:42px;border-radius:13px;background:#edf3ea;display:grid;place-items:center;font-size:21px;flex:none}.card-main{min-width:0;flex:1}.card-title{display:flex;justify-content:space-between;gap:10px;font-weight:800}.tag{font-size:11px;padding:3px 7px;border-radius:7px;background:#f0e7d4;color:#7a5b27;white-space:nowrap}.items{font-size:14px;line-height:1.7;margin-top:4px}.meta{font-size:12px;color:var(--muted);margin-top:5px}.note{font-size:12px;color:#666d68;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}.actions{display:flex;gap:8px;margin-top:12px}.actions button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;color:var(--green);font-size:12px;font-weight:700}.actions .copy{background:var(--green);color:white;border-color:var(--green)}
    .empty{text-align:center;padding:32px 18px;background:rgba(255,255,255,.45);border:1px dashed var(--line);border-radius:18px;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:5px}.skeleton{height:108px;border-radius:18px;background:linear-gradient(90deg,#ebe7dd 25%,#f7f4ed 45%,#ebe7dd 65%);background-size:300% 100%;animation:shine 1.3s infinite}@keyframes shine{to{background-position:-100% 0}}
    .bottom{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);height:72px;padding-bottom:env(safe-area-inset-bottom);background:rgba(255,253,247,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}.bottom button,.bottom a{border:0;background:transparent;color:var(--muted);text-decoration:none;display:grid;place-content:center;gap:3px;font-size:11px}.bottom b{font-size:20px;font-weight:400}.bottom .active{color:var(--green);font-weight:800}.bottom .publish b{width:42px;height:42px;margin-top:-21px;border-radius:15px;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px rgba(39,93,69,.25)}
    .modal-mask{position:fixed;z-index:50;inset:0;background:rgba(15,28,22,.55);display:none;align-items:flex-end;justify-content:center}.modal-mask.open{display:flex}.modal{width:min(760px,100%);max-height:88vh;overflow:auto;background:var(--paper);border-radius:24px 24px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom))}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal h2{margin:0;font-size:20px}.x{border:0;background:#eeeae0;border-radius:50%;width:34px;height:34px;color:#6c756f}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;height:46px;border:1px solid var(--line);background:white;border-radius:12px;padding:0 13px;outline:none}.modal .submit{width:100%;height:48px;border:0;border-radius:13px;background:var(--green);color:white;font-weight:800;margin-top:7px}.need-tags{display:flex;flex-wrap:wrap;gap:7px}.need-tag{border:1px solid #cad8cd;background:#edf4ee;color:var(--green);border-radius:9px;padding:7px 9px;font-size:12px}.need-tag button{border:0;background:transparent;color:var(--red);margin-left:5px}.mine-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f1ede3;border-radius:13px;padding:13px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}.toast{position:fixed;z-index:80;left:50%;bottom:94px;transform:translate(-50%,20px);background:#1c3328;color:white;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    .share-preview{display:block;width:100%;max-height:64vh;object-fit:contain;border-radius:14px;background:#173b2b}.share-tip{text-align:center;color:var(--muted);font-size:13px;margin:11px 0 0}
    @media(min-width:680px){.app{padding-left:24px;padding-right:24px}.list{grid-template-columns:1fr 1fr}.hero{padding:24px}.modal-mask{align-items:center}.modal{border-radius:24px;max-height:84vh;max-width:560px}}
  </style>
</head>
<body>
<main class="app">
  <header><div><div class="eyebrow">HOGWARTS HELP</div><h1 class="brand">霍格沃茨互助站</h1><p class="subtitle">更快找到你需要的草药、菜品和卡牌</p></div><button class="avatar" onclick="openMine()" aria-label="打开我的页面">♙</button></header>
  <div class="search"><input id="searchInput" placeholder="搜索草药、菜品、卡牌或玩家ID" oninput="onSearch()"><button id="clearBtn" class="clear" onclick="clearSearch()" aria-label="清除搜索">×</button></div>
  <section class="hero"><h2 id="matchTitle">正在寻找匹配信息…</h2><p id="matchCopy">保存你的需求，互助站会自动从全部分类中查找。</p><div class="hero-row"><button class="primary" onclick="openNeeds()">＋ 添加我的需求</button><button class="secondary" onclick="showMatches()">查看匹配</button></div></section>
  <div class="quick"><button onclick="setType('herb')"><b>🌿</b><span>找草药</span></button><button onclick="setType('cook')"><b>🍲</b><span>找菜品</span></button><button onclick="setType('trade')"><b>🃏</b><span>换卡片</span></button></div>
  <section class="section"><div class="section-head"><h2 id="listTitle">互助动态</h2><small id="resultCount">加载中</small></div><div class="chips"><button class="chip active" data-type="all" onclick="setType('all')">全部</button><button class="chip" data-type="match" onclick="setType('match')">与我匹配</button><button class="chip" data-type="herb" onclick="setType('herb')">草药</button><button class="chip" data-type="cook" onclick="setType('cook')">烹饪</button><button class="chip" data-type="trade" onclick="setType('trade')">换卡</button></div><div id="postList" class="list"><div class="skeleton"></div><div class="skeleton"></div></div></section>
</main>
<nav class="bottom" aria-label="主要导航"><button class="active" onclick="setType('all')"><b>⌂</b>首页</button><a href="herb.html"><b>🌿</b>草药</a><button class="publish" onclick="openPublish()"><b>＋</b>发布</button><a href="trade.html"><b>🃏</b>换卡</a><button onclick="openMine()"><b>♙</b>我的</button></nav>

<div id="needsModal" class="modal-mask" onclick="maskClose(event,'needsModal')"><div class="modal"><div class="modal-head"><h2>我的需求</h2><button class="x" onclick="closeModal('needsModal')">×</button></div><p class="subtitle">输入物品名称后保存，首页会自动显示匹配信息。</p><div class="field"><label for="needInput">草药、菜品或卡牌名称</label><input id="needInput" placeholder="例如：曼德拉草" maxlength="30" onkeydown="if(event.key==='Enter')addNeed()"></div><button class="submit" onclick="addNeed()">添加需求</button><div class="field"><label>已保存</label><div id="needTags" class="need-tags"></div></div></div></div>
<div id="publishModal" class="modal-mask" onclick="maskClose(event,'publishModal')"><div class="modal"><div class="modal-head"><h2>发布互助信息</h2><button class="x" onclick="closeModal('publishModal')">×</button></div><p class="subtitle">选择类型后进入对应表单，游戏ID会在三个页面间自动同步。</p><div class="quick"><button onclick="location.href='herb.html#publish'"><b>🌿</b><span>发布草药</span></button><button onclick="location.href='cook.html#publish'"><b>🍲</b><span>发布菜品</span></button><button onclick="location.href='trade.html#publish'"><b>🃏</b><span>发布换卡</span></button></div></div></div>
<div id="mineModal" class="modal-mask" onclick="maskClose(event,'mineModal')"><div class="modal"><div class="modal-head"><h2>我的互助站</h2><button class="x" onclick="closeModal('mineModal')">×</button></div><div class="field"><label for="gameIdInput">我的游戏ID</label><input id="gameIdInput" placeholder="设置后发布时自动填写" maxlength="40"><button class="submit" onclick="saveGameId()">保存游戏ID</button></div><div class="mine-stats"><div class="stat"><b id="minePostCount">0</b><span>我的发布</span></div><div class="stat"><b id="mineNeedCount">0</b><span>我的需求</span></div><div class="stat"><b id="mineMatchCount">0</b><span>匹配结果</span></div></div><div class="section"><div class="section-head"><h2>我的发布</h2><button class="link-btn" onclick="shareMyPosts()">生成分享图</button></div><div id="mineList" class="list"></div></div></div></div>
<div id="shareModal" class="modal-mask" onclick="maskClose(event,'shareModal')"><div class="modal"><div class="modal-head"><h2>互助分享图</h2><button class="x" onclick="closeModal('shareModal')">×</button></div><img id="sharePreview" class="share-preview" alt="互助信息分享图"><p class="share-tip">长按图片保存，然后发送给需要的伙伴</p><button class="submit" onclick="shareGeneratedImage()">分享或保存图片</button></div></div>
<div id="toast" class="toast"></div>
<canvas id="shareCanvas" width="1080" height="1440" hidden></canvas>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://ygslzwiznvcfujonvblq.supabase.co';
const PUBLIC_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlnc2x6d2l6bnZjZnVqb252YmxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNDM4NjksImV4cCI6MjA5NTYxOTg2OX0.J9P1NyK5tiSzPZgDeLpwfS2eRaFrP5Gb4fgpmA258vA';
const sb=window.supabase.createClient(SUPABASE_URL,PUBLIC_KEY);
const OWNER_KEY='hogwarts_owner_id',GAME_ID_KEY='hogwarts_game_id',NEEDS_KEY='hogwarts_needs_v1';
let ownerId=localStorage.getItem(OWNER_KEY);if(!ownerId){ownerId=crypto.randomUUID?.()||('u_'+Date.now()+'_'+Math.random().toString(36).slice(2));localStorage.setItem(OWNER_KEY,ownerId)}
let allPosts=[],currentType='all',needs=readNeeds(),query='';
const typeInfo={herb:{label:'草药',icon:'🌿',href:'herb.html'},cook:{label:'烹饪',icon:'🍲',href:'cook.html'},trade:{label:'换卡',icon:'🃏',href:'trade.html'}};
function readNeeds(){try{return JSON.parse(localStorage.getItem(NEEDS_KEY)||'[]').filter(Boolean)}catch{return[]}}
function parseItems(value,fallback){try{const p=JSON.parse(value);if(Array.isArray(p))return p.map(x=>({name:x.card||x.n||String(x),qty:x.count||x.q||''}));if(Array.isArray(p.items))return p.items.map(x=>({name:x.n||x.card,qty:x.q||x.count||''}))}catch{}return [{name:fallback||value||'未命名',qty:''}]}
function normalizeHerb(p){const items=parseItems(p.herb_name,p.herb_name);return {id:p.id,type:'herb',items,player:p.player_id||'',owner:p.owner_id||'',note:p.note||'',mature:+p.mature_time||0,expire:+p.expire_time||0,created:+p.created_at||0,raw:p}}
function normalizeCook(p){return {id:p.id,type:'cook',items:parseItems(p.dish_name,p.dish_name),player:p.player_id||'',owner:p.owner_id||'',note:p.note||'',mature:+p.mature_time||0,expire:+p.expire_time||0,created:+p.created_at||0,raw:p}}
function normalizeTrade(p){const offers=parseItems(p.offer_cards,'');return {id:p.id,type:'trade',items:[{name:p.want_card||'未命名卡牌',qty:''}],offers,player:p.game_id||'',owner:p.owner_id||'',note:p.remark||'',mature:0,expire:0,created:+p.created_at||0,raw:p}}
async function loadAll(){
  const now=Date.now();
  try{
    const [h,c,t]=await Promise.all([
      sb.from('herb_posts').select('*').gt('expire_time',now).order('mature_time',{ascending:true}).limit(200),
      sb.from('cook_posts').select('*').gt('expire_time',now).order('expire_time',{ascending:true}).limit(200),
      sb.from('trade_posts').select('*').order('created_at',{ascending:false}).limit(200)
    ]);
    const errors=[h.error,c.error,t.error].filter(Boolean);if(errors.length===3)throw errors[0];
    allPosts=[...(h.data||[]).map(normalizeHerb),...(c.data||[]).map(normalizeCook),...(t.data||[]).map(normalizeTrade)].sort((a,b)=>sortTime(a)-sortTime(b));
    updateMatchHero();render();
  }catch(e){console.error(e);document.getElementById('postList').innerHTML='<div class="empty"><b>暂时无法连接互助站</b>请检查网络后刷新重试</div>';document.getElementById('resultCount').textContent='加载失败'}
}
function sortTime(p){return p.mature>Date.now()?p.mature:(p.expire||p.created||Date.now())}
function searchable(p){return [p.player,p.note,...p.items.map(x=>x.name),...(p.offers||[]).map(x=>x.name)].join(' ').toLowerCase()}
function matchableItems(p){return p.type==='trade'?(p.offers||[]):p.items}
function normalizeMatchText(value){return String(value||'').trim().toLowerCase()}
function matches(p){
  if(!needs.length||p.owner===ownerId)return false;
  const provided=matchableItems(p).map(x=>normalizeMatchText(x.name)).filter(Boolean);
  return needs.some(need=>{
    const wanted=normalizeMatchText(need);
    return wanted&&provided.some(item=>item===wanted)
  })
}
function getFiltered(){return allPosts.filter(p=>(currentType==='all'||(currentType==='match'?matches(p):p.type===currentType))&&(!query||searchable(p).includes(query)))}
function render(){
  const posts=getFiltered(),el=document.getElementById('postList');document.getElementById('resultCount').textContent=`共 ${posts.length} 条`;
  document.getElementById('listTitle').textContent=query?'搜索结果':currentType==='match'?'与你匹配':currentType==='all'?'互助动态':typeInfo[currentType].label+'互助';
  if(!posts.length){el.innerHTML=`<div class="empty"><b>${currentType==='match'&&!needs.length?'先添加你的需求吧':'暂时没有找到信息'}</b>${currentType==='match'&&!needs.length?'保存后会自动匹配全部互助信息':'换个关键词或稍后再来看看'}</div>`;return}
  el.innerHTML=posts.map(cardHtml).join('');
}
function cardHtml(p){
  const info=typeInfo[p.type],itemText=p.items.map(x=>`${esc(x.name)}${x.qty?' ×'+esc(x.qty):''}`).join('、');
  const trade=p.type==='trade'&&p.offers?.length?`<div class="meta">可提供：${p.offers.map(x=>esc(x.name)+(x.qty?' ×'+esc(x.qty):'')).join('、')}</div>`:'';
  const when=timeText(p),own=p.owner===ownerId;
  return `<article class="card"><div class="card-top"><div class="type-icon">${info.icon}</div><div class="card-main"><div class="card-title"><span>${p.type==='trade'?'需要：':''}${itemText}</span><span class="tag">${matches(p)?'与你匹配':info.label}</span></div>${trade}<div class="meta">${when}${p.player?' · 玩家 '+esc(maskId(p.player)):''}</div>${p.note?`<div class="note">${esc(p.note)}</div>`:''}</div></div><div class="actions">${p.player?`<button class="copy" onclick="copyText('${js(p.player)}')">复制游戏ID</button>`:''}<button onclick="sharePost('${p.type}','${js(String(p.id))}')">生成分享图</button><button onclick="location.href='${info.href}'">查看分类</button>${own?'<span class="tag" style="align-self:center">我的发布</span>':''}</div></article>`
}
function timeText(p){const now=Date.now();if(p.type==='trade')return '换卡信息';if(p.mature>now)return `${duration(p.mature-now)}后完成`;if(p.expire>now)return `可领取 · ${duration(p.expire-now)}后结束`;return '已结束'}
function duration(ms){const m=Math.max(1,Math.ceil(ms/60000));return m>=1440?Math.floor(m/1440)+'天':m>=60?Math.floor(m/60)+'小时':m+'分钟'}
function setType(type){currentType=type;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.type===type));render();if(type==='match')document.querySelector('.section').scrollIntoView({behavior:'smooth'})}
function showMatches(){setType('match')}
function onSearch(){query=document.getElementById('searchInput').value.trim().toLowerCase();document.getElementById('clearBtn').style.display=query?'block':'none';render()}
function clearSearch(){document.getElementById('searchInput').value='';query='';document.getElementById('clearBtn').style.display='none';render()}
function updateMatchHero(){const n=allPosts.filter(matches).length;document.getElementById('matchTitle').textContent=needs.length?(n?`找到 ${n} 条与你匹配的信息`:'暂时没有匹配，稍后再看看'):'让互助信息主动找到你';document.getElementById('matchCopy').textContent=needs.length?`正在关注：${needs.slice(0,3).join('、')}${needs.length>3?' 等':''}`:'保存需要的物品，我们会从全部分类中自动查找。'}
function openNeeds(){renderNeeds();openModal('needsModal');setTimeout(()=>document.getElementById('needInput').focus(),100)}
function renderNeeds(){const el=document.getElementById('needTags');el.innerHTML=needs.length?needs.map((n,i)=>`<span class="need-tag">${esc(n)}<button onclick="removeNeed(${i})">×</button></span>`).join(''):'<span class="subtitle">还没有保存需求</span>'}
function addNeed(){const input=document.getElementById('needInput'),v=input.value.trim();if(!v)return toast('请输入物品名称');if(!needs.some(n=>n.toLowerCase()===v.toLowerCase()))needs.unshift(v);needs=needs.slice(0,20);localStorage.setItem(NEEDS_KEY,JSON.stringify(needs));input.value='';renderNeeds();updateMatchHero();render();toast('需求已保存')}
function removeNeed(i){needs.splice(i,1);localStorage.setItem(NEEDS_KEY,JSON.stringify(needs));renderNeeds();updateMatchHero();render()}
function openPublish(){openModal('publishModal')}
function openMine(){const mine=allPosts.filter(p=>p.owner===ownerId),matched=allPosts.filter(matches);document.getElementById('gameIdInput').value=localStorage.getItem(GAME_ID_KEY)||'';document.getElementById('minePostCount').textContent=mine.length;document.getElementById('mineNeedCount').textContent=needs.length;document.getElementById('mineMatchCount').textContent=matched.length;document.getElementById('mineList').innerHTML=mine.length?mine.map(cardHtml).join(''):'<div class="empty"><b>还没有发布</b>发布互助信息后会显示在这里</div>';openModal('mineModal')}
function saveGameId(){const v=document.getElementById('gameIdInput').value.trim();if(v)localStorage.setItem(GAME_ID_KEY,v);else localStorage.removeItem(GAME_ID_KEY);toast('游戏ID已保存')}
function openModal(id){document.getElementById(id).classList.add('open');document.body.style.overflow='hidden'}function closeModal(id){document.getElementById(id).classList.remove('open');document.body.style.overflow=''}function maskClose(e,id){if(e.target.id===id)closeModal(id)}
async function copyText(value){try{await navigator.clipboard.writeText(value)}catch{const t=document.createElement('textarea');t.value=value;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}toast('游戏ID已复制')}
function sharePost(type,id){const p=allPosts.find(x=>x.type===type&&String(x.id)===id);if(p)makeShareCard([p])}
function shareMyPosts(){const mine=allPosts.filter(p=>p.owner===ownerId);if(!mine.length)return toast('还没有可以分享的发布');makeShareCard(mine.slice(0,4))}
function makeShareCard(posts){
  const canvas=document.getElementById('shareCanvas'),c=canvas.getContext('2d'),grad=c.createLinearGradient(0,0,1080,1440);grad.addColorStop(0,'#173b2b');grad.addColorStop(1,'#10261d');c.fillStyle=grad;c.fillRect(0,0,1080,1440);c.fillStyle='#d5ad67';c.font='700 30px sans-serif';c.fillText('HOGWARTS HELP',72,100);c.fillStyle='#fffdf4';c.font='700 64px serif';c.fillText('霍格沃茨互助',72,185);c.fillStyle='#cbdace';c.font='30px sans-serif';c.fillText('更快找到你需要的伙伴',72,235);
  let y=330;posts.forEach((p,i)=>{c.fillStyle='rgba(255,255,255,.09)';roundRect(c,58,y-54,964,210,28);c.fill();c.fillStyle='#f1cf8e';c.font='700 30px sans-serif';c.fillText(`${typeInfo[p.type].icon} ${typeInfo[p.type].label}${p.type==='trade'?' · 我需要':''}`,92,y);c.fillStyle='#fff';c.font='700 39px sans-serif';wrapText(c,p.items.map(x=>x.name+(x.qty?' ×'+x.qty:'')).join('、'),92,y+58,850,48);c.fillStyle='#cbdace';c.font='26px sans-serif';c.fillText(p.player?'游戏ID：'+p.player:timeText(p),92,y+132);y+=240});
  c.fillStyle='#d5ad67';c.font='700 31px sans-serif';c.fillText('保存图片，分享给需要的伙伴',72,1330);c.fillStyle='#b8c8bc';c.font='24px sans-serif';c.fillText(location.host||'霍格沃茨互助站',72,1374);
  document.getElementById('sharePreview').src=canvas.toDataURL('image/png');openModal('shareModal');
}
async function shareGeneratedImage(){const src=document.getElementById('sharePreview').src;if(!src)return;const blob=await (await fetch(src)).blob(),file=new File([blob],'霍格沃茨互助.png',{type:'image/png'});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'霍格沃茨互助'})}else{const a=document.createElement('a');a.download=file.name;a.href=src;a.click();toast('如未自动保存，请长按上方图片')}}catch(e){if(e.name!=='AbortError')toast('请长按上方图片保存')}}
function roundRect(c,x,y,w,h,r){c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h)}
function wrapText(c,text,x,y,max,line){let s='';for(const ch of text){if(c.measureText(s+ch).width>max){c.fillText(s,x,y);s=ch;y+=line}else s+=ch}c.fillText(s,x,y)}
function maskId(v){v=String(v);return v.length>6?v.slice(0,3)+'***'+v.slice(-2):v}
function esc(s){return String(s??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}function js(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,' ')}
let toastTimer;function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
loadAll();
</script>
