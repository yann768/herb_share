<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#241735"><meta name="description" content="玩家相册、穿搭、绘画手作、梗图与攻略作品分享"><title>魔法创作广场</title><link rel="stylesheet" href="creation.css?v=20260819-1"></head><body>
<main class="app"><header><a href="index.html">‹ 返回互助首页</a><div class="eyebrow">MAGICAL CREATIONS</div><h1>魔法创作广场</h1><p>作品发布社区 · 投稿先审核 · 请勿留下联系方式</p><button id="publishBtn">＋ 投稿作品</button></header>
<nav id="filters" class="filters"></nav><section class="toolbar"><button id="publicTab" class="active">公开作品</button><button id="mineTab">我的投稿</button><button id="reviewTab" hidden>审核台</button><span id="count">加载中…</span></section><section id="grid" class="grid"><div class="empty">正在加载作品…</div></section></main>
<div id="modal" class="mask"><form id="form" class="modal"><div class="modal-head"><h2>投稿作品</h2><button type="button" id="closeBtn">×</button></div><label>分类<select id="category"><option value="album">玩家相册</option><option value="outfit">穿搭</option><option value="art">绘画手作</option><option value="meme">梗图</option><option value="guide">攻略</option></select></label><label>标题<input id="title" maxlength="50" required></label><label>作者昵称（可选）<input id="author" maxlength="20"></label><label>作品说明（可选）<textarea id="body" maxlength="1000"></textarea></label><label>图片（1～6张，单张不超过8MB）<input id="images" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple required></label><div id="preview" class="preview"></div><p class="notice">投稿后进入审核队列；禁止联系方式、引流、侵权及不适宜内容。</p><button id="submitBtn" type="submit">提交审核</button></form></div><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="site-common.js?v=20260813-2"></script><script src="creation.js?v=20260819-1"></script></body></html>
